<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Documento</title>
    <link href="{{ url_for('static', filename='cascada.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5; 
            font-family: Arial, sans-serif;
            color: #343a40;
        }
        .container {
            max-width: 600px; 
            margin: auto; 
            padding: 20px; 
            background-color: #ffffff; 
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #007bff; 
            margin-bottom: 20px; 
        }
        .mb-3 {
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 5px;
            padding: 15px; 
            margin-bottom: 20px; 
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .mb-3 label {
            font-weight: bold; 
            color: #495057; 
        }
        .mb-3 input, .mb-3 select {
            border: 1px solid #ced4da; 
            border-radius: 4px; 
            padding: 10px; 
            width: 95%; 
            transition: border-color 0.3s; 
        }
        .mb-3 input:focus, .mb-3 select:focus {
            border-color: #007bff; 
            outline: none; 
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25); 
        }

        .btn {
            border-radius: 5px; 
            padding: 10px 15px;
            font-weight: bold; 
        }
        .btn-primary {
            background-color: #007bff; 
            border: none; 
            color: white; 
        }
        .btn-primary:hover {
            background-color: #0056b3; 
        }
        .btn-secondary {
            background-color: #6c757d; 
            border: none; 
            color: white; 
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .alert {
            margin-bottom: 20px;
            border-radius: 5px; 
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Editar Documento</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('editar_modificardis', id=documento.id) }}">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="nombre" name="nombre" value="{{ documento.nombre }}" required>
            </div>
            <div class="mb-3">
                <label for="tipo_doc" class="form-label">Tipo de Documento:</label>
                <select class="form-select" id="tipo_doc" name="tipo_doc" required>
                    <option value="cc" {% if documento.tipo_doc == 'cc' %}selected{% endif %}>Cédula de Ciudadanía</option>
                    <option value="ce" {% if documento.tipo_doc == 'ce' %}selected{% endif %}>Cédula de Extranjería</option>
                    <option value="ti" {% if documento.tipo_doc == 'ti' %}selected{% endif %}>Tarjeta de Identidad</option>
                    <option value="pp" {% if documento.tipo_doc == 'pp' %}selected{% endif %}>Pasaporte</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="numero_doc" class="form-label">Número de Documento:</label>
                <input type="number" class="form-control" id="numero_doc" name="numero_doc" value="{{ documento.numero_doc }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Actualizar Documento</button>
            <a href="{{ url_for('modificardis') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
